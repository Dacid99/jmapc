[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "jmaplib"
version = "0.1.0"
description = "JMAP protocol client for Python"
keywords = [
    "email",
    "mail",
    "jmap",
    "protocol",
    "client",
    "fastmail",
]
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]
authors = [ { name = "David Aderbauer", email = "no@email.org" } ]
readme = "README.md"
repository = "https://github.com/Dacid99/jmaplib"
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Email :: Post-Office",
    "Topic :: Office/Business :: Groupware",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "brotli",
    "dataclasses-json",
    "python-dateutil",
    "requests",
    "sseclient",
]

[project.urls]
Homepage = "https://github.com/Dacid99/jmaplib"
Issues = "https://github.com/Dacid99/jmaplib/-/issues"
Documentation = "https://github.com/Dacid99/jmaplib/-/blob/main/README.md"
Repository = "https://github.com/Dacid99/jmaplib.git"
Changelog = "https://github.com/Dacid99/jmaplib/-/blob/main/CHANGELOG.md"

[tool.poetry]
requires-poetry = ">=2.0"

[tool.poetry.group.dev]
optional=true
include-groups=[
    "lint",
    "test",
    "stubs",
    "docs",
]

[tool.poetry.group.dev.dependencies]
poethepoet = "*"
pre-commit = "*"

[tool.poetry.group.lint]
optional=true

[tool.poetry.group.lint.dependencies]
doc8 = "*"
black = "*"
mypy = "*"

[tool.poetry.group.test]
optional=true

[tool.poetry.group.test.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-github-actions-annotate-failures = "*"
responses = "*"

[tool.poetry.group.stubs]
optional=true

[tool.poetry.group.stubs.dependencies]
types-python-dateutil = "*"
types-requests = "*"

[tool.poetry.group.docs]
optional=true

[tool.poetry.group.docs.dependencies]
sphinx = "*"
sphinx-rtd-theme = "*"
myst-parser = "*"

[tool.poe.tasks.lint]
cmd = "pre-commit run --all-files --show-diff-on-failure"
help = "Check all files"

[tool.poe.tasks.pytest]
cmd = "pytest"
help = "Run unit tests with pytest"

[tool.poe.tasks.docs-build]
cmd = "sphinx-build -b html docs docs/_build/html"
help = "Build documentation with Sphinx"

[tool.poe.tasks.docs-serve]
cmd = "python -m http.server 8000 --directory docs/_build/html"
help = "Serve documentation locally on http://localhost:8000"

[tool.poe.tasks.docs-clean]
cmd = "rm -rf docs/_build"
help = "Clean documentation build directory"

[tool.poe.tasks.test]
sequence = ["lint", "pytest"]
help = "Run all tests"
